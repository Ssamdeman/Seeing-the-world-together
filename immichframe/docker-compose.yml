name: immichframe
services:
  immichframe:
    container_name: immichframe
    image: ghcr.io/immichframe/immichframe:v1.0.39.0
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      TZ: "America/Los_Angeles"
    volumes:
      - ./config:/app/Config
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
networks:
  default:
    name: immich_default
    external: true